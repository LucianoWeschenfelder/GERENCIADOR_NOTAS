<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <header>
    <h1>Notas</h1>
    <div id="search-container">
      <i class="bi bi-search"></i>
      <input type="text" id="search-input" placeholder="Busque por uma nota">
    </div>
    <button id="export-notes">Exportar CSV <i class="bi bi-download"></i></button>
    <div class="container">
      <button id="btnTema" class="btn">Alternar tema 🌗</button>
    </div>
  </header>
  <div id="add-note-container">
    <input type="text" id="note-content" placeholder="Anote Aqui" />
    <button class="add-note"><i class="bi bi-plus-lg"></i></button>
  </div>
  <div id="notes-container">
  </div>
</body>

</html>
